{% extends "base.html" %}

{% block title %}注册 - 审究AI{% endblock %}

{% block extra_css %}
<style>
.register-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    background: transparent;
}

.register-box {
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(10px);
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    width: 100%;
    max-width: 400px;
    transition: transform 0.3s ease;
}

.register-box:hover {
    transform: translateY(-5px);
}

.register-title {
    text-align: center;
    margin-bottom: 30px;
    color: #333;
    font-size: 24px;
    font-weight: 600;
}

.register-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
}

.form-group label {
    color: #666;
    font-size: 14px;
    font-weight: 500;
}

.form-group input {
    padding: 12px 36px 12px 12px;
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 8px;
    font-size: 16px;
    transition: all 0.3s;
    background: rgba(255, 255, 255, 0.8);
}

.form-group input:focus {
    border-color: rgba(74, 108, 247, 0.5);
    outline: none;
    box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.1);
}

.form-group i {
    position: absolute;
    right: 12px;
    top: 38px;
    color: #999;
    cursor: pointer;
    transition: color 0.3s;
}

.form-group i:hover {
    color: #4a6cf7;
}

.register-btn {
    background: rgba(74, 108, 247, 0.9);
    color: white;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.register-btn:hover {
    background: rgba(74, 108, 247, 1);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(74, 108, 247, 0.2);
}

.register-btn:active {
    transform: translateY(0);
}

.register-footer {
    text-align: center;
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid rgba(0, 0, 0, 0.08);
}

.register-footer a {
    color: #4a6cf7;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s;
}

.register-footer a:hover {
    color: #3857d6;
    text-decoration: underline;
}

.error-message {
    display: none;
    color: #dc3545;
    background: rgba(220, 53, 69, 0.1);
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 14px;
    text-align: center;
    border: 1px solid rgba(220, 53, 69, 0.2);
}

.error-message.show {
    display: block;
    animation: shake 0.5s ease-in-out;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
}

.password-requirements {
    font-size: 12px;
    color: #666;
    margin-top: 4px;
}

.success-message {
    display: none;
    color: #28a745;
    background: rgba(40, 167, 69, 0.1);
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 14px;
    text-align: center;
    border: 1px solid rgba(40, 167, 69, 0.2);
}

.success-message.show {
    display: block;
    animation: fadeIn 0.5s ease-in-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
{% endblock %}

{% block content %}
<div class="register-container">
    <div class="register-box">
        <h2 class="register-title">注册审究AI</h2>
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        <form class="register-form" id="registerForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required placeholder="请输入用户名">
                <i class="fas fa-user"></i>
                <div class="password-requirements">用户名长度3-20位，只能包含字母、数字和下划线</div>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required placeholder="请输入密码">
                <i class="fas fa-lock"></i>
                <div class="password-requirements">密码长度至少6位，建议包含字母、数字和特殊字符</div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">确认密码</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="请再次输入密码">
                <i class="fas fa-lock"></i>
            </div>
            <button type="submit" class="register-btn">
                <i class="fas fa-user-plus"></i> 注册
            </button>
        </form>
        <div class="register-footer">
            <a href="/login">已有账号？立即登录</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function showError(message) {
    const errorDiv = document.getElementById('errorMessage');
    const successDiv = document.getElementById('successMessage');
    errorDiv.textContent = message;
    errorDiv.classList.add('show');
    successDiv.classList.remove('show');
}

function showSuccess(message) {
    const errorDiv = document.getElementById('errorMessage');
    const successDiv = document.getElementById('successMessage');
    successDiv.textContent = message;
    successDiv.classList.add('show');
    errorDiv.classList.remove('show');
}

function hideMessages() {
    document.getElementById('errorMessage').classList.remove('show');
    document.getElementById('successMessage').classList.remove('show');
}

function validateForm(username, password, confirmPassword) {
    if (!username || !password || !confirmPassword) {
        showError('请填写所有必填项');
        return false;
    }

    if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
        showError('用户名格式不正确，只能包含字母、数字和下划线，长度3-20位');
        return false;
    }

    if (password.length < 6) {
        showError('密码长度不能少于6位');
        return false;
    }

    if (password !== confirmPassword) {
        showError('两次输入的密码不一致');
        return false;
    }

    return true;
}

document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMessages();
    
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    
    if (!validateForm(username, password, confirmPassword)) {
        return;
    }
    
    try {
        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').content
            },
            body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            showSuccess('注册成功！正在跳转到登录页面...');
            document.querySelector('.register-box').style.transform = 'scale(0.95)';
            setTimeout(() => {
                window.location.href = '/login';
            }, 1500);
        } else {
            showError(data.message || '注册失败，请稍后重试');
        }
    } catch (error) {
        console.error('注册请求错误:', error);
        showError('网络错误，请稍后重试');
    }
});

// 输入框获得焦点时隐藏错误信息
document.querySelectorAll('input').forEach(input => {
    input.addEventListener('focus', hideMessages);
});

// 添加密码可见性切换功能
document.querySelectorAll('.fa-lock').forEach(icon => {
    icon.addEventListener('click', function() {
        const passwordInput = this.previousElementSibling;
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            this.classList.remove('fa-lock');
            this.classList.add('fa-lock-open');
        } else {
            passwordInput.type = 'password';
            this.classList.remove('fa-lock-open');
            this.classList.add('fa-lock');
        }
    });
});
</script>
{% endblock %}
