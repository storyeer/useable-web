{% extends "base.html" %}

{% block title %}审究 AI 助手{% endblock %}

{% block styles %}
<link rel="stylesheet" href="/static/css/chat.css?v={{ resource_version }}">
<link rel="stylesheet" href="/static/css/interactions.css?v={{ resource_version }}">
{% endblock %}

{% block content %}
<!-- 主要内容区 -->
<div class="main-container">
    <!-- 侧边栏 -->
    <aside class="sidebar">
        <div class="history-header">
            <h3>历史记录</h3>
            <div class="history-search">
                <input type="text" id="historySearch" placeholder="搜索历史记录...">
                <i class="fas fa-search"></i>
            </div>
        </div>
        <div class="history-content" id="historyContent">
            <div class="loading-spinner" style="display: none;">
                <i class="fas fa-spinner fa-spin"></i>
            </div>
        </div>
    </aside>

    <!-- 聊天区域 -->
    <div class="chat-container">
        <!-- 添加标题区域 -->
        <div id="title-area" class="title-area">
            <h1>审究 AI</h1>
            <p>让审计更智能，让工作更高效</p>
        </div>

        <div class="chat-messages" id="chat-messages">
            <!-- 消息内容会动态添加到这里 -->
        </div>
    </div>

    <div class="bottom-container">
        <div class="chat-input-area">
            <textarea 
                id="chat-input"
                class="chat-input" 
                placeholder="请输入您想要了解的内容..."
                rows="1"
            ></textarea>
            
            <div class="chat-buttons">
                <button id="send-btn" class="chat-button" disabled>
                    <i class="fas fa-paper-plane"></i>
                </button>
                <button id="think-btn" class="chat-button" title="思考模式">
                    <i class="fas fa-brain"></i>
                </button>
                <button id="search-btn" class="chat-button" title="搜索模式">
                    <i class="fas fa-search"></i>
                </button>
                <button id="model-select-btn" class="chat-button" title="选择模型">
                    <i class="fas fa-robot"></i>
                </button>
            </div>
        </div>
        
        <!-- 模型选择下拉框 -->
        <div id="model-select-dropdown" class="model-select-dropdown" style="display: none;">
            <div class="model-select-header">选择模型</div>
            <div class="model-select-options">
                <div class="model-option" data-model="1" data-selected="true">
                    <div class="model-name">Qwen2.5-0.5B-Instruct</div>
                    <div class="model-desc">默认模型(ID:1)</div>
                </div>
                <div class="model-option" data-model="2">
                    <div class="model-name">DeepSeek-R1-Distill-Qwen-14B</div>
                    <div class="model-desc">高级模型(ID:2)</div>
                </div>
            </div>
        </div>
        
        <!-- 新对话按钮 -->
        <div id="new-chat-wrapper" class="new-chat-wrapper" style="display: none;">
            <button id="new-chat-btn" class="new-chat-btn">
                <i class="fas fa-plus"></i> 新对话
            </button>
        </div>
    </div>
</div>

<!-- 错误提示 -->
<div id="errorToast" class="error-toast" style="display: none;"></div>
{% endblock %}

{% block scripts %}
<script src="/static/js/chat-manager.js?v={{ resource_version }}"></script>
<script src="/static/js/nav-manager.js?v={{ resource_version }}"></script>
<script src="/static/js/api-service.js?v={{ resource_version }}"></script>
<script src="/static/js/auth.js?v={{ resource_version }}"></script>

<!-- 初始化脚本 -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 初始化聊天管理器
        window.chatManager = new ChatManager();
        
        // 如果服务器传递了对话ID，设置到全局变量
        {% if conversation_id %}
            console.log('从服务器获取对话ID: {{ conversation_id }}');
            if (window.chatManager) {
                window.chatManager.conversationId = '{{ conversation_id }}';
                // 加载对话内容
                window.chatManager.loadConversation('{{ conversation_id }}');
            }
        {% endif %}
    });
</script>
{% endblock %}
