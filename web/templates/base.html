<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}审究AI - 让审计更智能，让工作更高效{% endblock %}</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/static/css/style.css?v={{ resource_version }}">
    <!-- 预加载字体和关键资源 -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/css/style.css?v={{ resource_version }}" as="style">
    <link rel="preload" href="/static/js/common.js?v={{ resource_version }}" as="script">
    <!-- 网站图标 -->
    <link rel="icon" href="data:,">  <!-- 空白favicon防止404请求 -->
    <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
    <!-- 添加Apple Touch图标 -->
    <link rel="apple-touch-icon" href="/static/img/favicon.svg">
    <!-- 添加Web应用清单 -->
    <link rel="manifest" href="/static/manifest.json">
    <!-- 其他元数据 -->
    <meta name="theme-color" content="#4a6cf7">
    <meta name="description" content="审究 AI - 让审计更智能，让工作更高效">
    <meta name="resource-version" content="{{ resource_version }}">
    <!-- 如果是游客模式，添加元标签 -->
    {% if request.cookies.get('guest_mode') %}
    <meta name="set-guest-mode" content="true">
    {% endif %}
    <meta name="csrf-token" content="{{ csrf_token }}">
    {% block extra_css %}{% endblock %}
    <!-- 移除旧的导航栏样式 -->
    {% block styles %}{% endblock %}
    <link rel="stylesheet" href="/static/css/navbar-fix.css?v={{ resource_version }}">
</head>
<body>
    <!-- 垂直导航栏 -->
    <div class="vertical-nav">
        <div class="nav-content">
            <!-- 导航栏展开/收起按钮 -->
            <button class="nav-toggle-btn" id="navToggleBtn" title="展开/收起导航栏">
                <i class="fas fa-chevron-right" id="navToggleIcon"></i>
            </button>
            <div class="nav-top">
                <a href="/" class="nav-item" id="nav-home">
                    <i class="fas fa-home"></i>
                    <div class="nav-text">首页</div>
                </a>
                <a href="#" class="nav-item" id="nav-history">
                    <i class="fas fa-history"></i>
                    <div class="nav-text">历史记录</div>
                </a>
            </div>
            
            <div class="nav-bottom">
                <a href="/login" class="nav-item" id="nav-user">
                    <i class="fas fa-user"></i>
                    <div class="nav-text">登录</div>
                </a>
            </div>
        </div>
    </div>

    <!-- 历史记录侧边栏 -->
    <div class="history-overlay" id="history-overlay"></div>
    <div class="history-sidebar" id="history-sidebar">
        <div class="history-header">
            <h3>历史记录</h3>
            <button class="history-close">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="history-content">
            <div class="history-list" id="history-list">
                <!-- 历史记录将通过 JavaScript 动态加载 -->
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <!-- 内容区 -->
    <div class="content-area">
        {% block content %}{% endblock %}
    </div>
    
    <!-- 脚本引用 -->
    <script src="/static/js/common.js?v={{ resource_version }}"></script>
    <!-- 在其他脚本之前引入 API 服务 -->
    <script src="{{ url_for('static', filename='js/api-service.js', v=resource_version) }}"></script>
    <!-- 其他脚本 -->
    <script src="{{ url_for('static', filename='js/nav-manager.js', v=resource_version) }}"></script>
    {% if debug %}
    <script src="/static/js/debug-helper.js?v={{ resource_version }}"></script>
    <script src="/static/js/error-recovery.js?v={{ resource_version }}"></script>
    {% endif %}
    {% block scripts %}{% endblock %}
</body>
</html>
