{% extends "base.html" %}

{% block title %}404 - 页面未找到 - 审究AI{% endblock %}

{% block extra_css %}
<style>
.error-page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 20px;
}

.error-page h1 {
    font-size: 120px;
    color: #4a6cf7;
    margin: 0;
    line-height: 1;
    opacity: 0.5;
}

.error-page p {
    font-size: 24px;
    color: #666;
    margin: 20px 0 30px;
}

.back-home {
    display: inline-block;
    padding: 12px 24px;
    background: #4a6cf7;
    color: white;
    text-decoration: none;
    border-radius: 5px;
    transition: all 0.3s ease;
}

.back-home:hover {
    background: #3857d6;
    transform: translateY(-2px);
}
</style>
{% endblock %}

{% block content %}
<div class="error-page">
    <h1>404</h1>
    <p>页面未找到</p>
    <a href="/" class="back-home">返回首页</a>
</div>
{% endblock %}
